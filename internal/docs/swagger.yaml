basePath: /api/
definitions:
  _ResponseWithData:
    description: Общий ответ success/error, содержащий произвольные данные.
    properties:
      data:
        description: Объект полезной нагрузки
      status:
        description: Результат запроса
        type: string
    type: object
  _ResponseWithMessage:
    description: Общий простой ответ, который передает только понятное для человека
      сообщение.
    properties:
      message:
        description: Человеко-читаемое сообщение
        type: string
      status:
        description: Результат запроса
        type: string
    type: object
  Article:
    description: модель статьи.
    properties:
      content_en:
        description: Содержимое статьи на английском
        example: Example
        type: string
      content_ru:
        description: Содержимое статьи на русском
        example: Пример
        type: string
      createdAt:
        description: Timestamp создания аккаунта
        example: "2006-01-02T15:04:05Z"
        format: date-time
        type: string
      id:
        description: ID статьи (UUID)
        example: b4b03119-1290-44bc-b599-6a5e91d6611f
        type: string
      title_en:
        description: Заголовок статьи на английском языке
        example: Example
        type: string
      title_ru:
        description: Заголовок статьи на русском языке
        example: Пример
        type: string
      updatedAt:
        description: Timestamp последнего обновления аккаунта
        example: "2006-01-02T15:04:05Z"
        format: date-time
        type: string
    required:
    - content_en
    - content_ru
    - createdAt
    - id
    - title_en
    - title_ru
    - updatedAt
    type: object
  ArticleCreateRequest:
    description: Данные, передаваемые для создания статьи.
    properties:
      content_en:
        description: Содержимое статьи на английском
        type: string
      content_ru:
        description: Содержимое статьи на русском
        type: string
      title_en:
        description: Заголовок статьи на английском языке
        type: string
      title_ru:
        description: Заголовок статьи на русском языке
        type: string
    required:
    - content_en
    - content_ru
    - title_en
    - title_ru
    type: object
  AuthRequest:
    description: Данные, передаваемые в json для регистрации.
    properties:
      email:
        description: Электронная почта пользователя
        example: Dimka228@gmail.com
        format: email
        type: string
      password:
        description: Пароль пользователя
        example: "12345678"
        format: password
        minLength: 8
        type: string
      username:
        description: Имя пользователя
        example: Dimka228
        type: string
    required:
    - email
    - password
    - username
    type: object
  AuthResponse:
    description: Данные, которые получает пользователь после регистрации.
    properties:
      token:
        description: Токен для подтверждения регистрации
        items:
          type: integer
        type: array
      user:
        $ref: '#/definitions/User'
    required:
    - token
    type: object
  AuthToken:
    description: Токен для подтверждения регистрации.
    properties:
      token:
        description: Токен для подтверждения регистрации
        items:
          type: integer
        type: array
    required:
    - token
    type: object
  ConfirmationRequest:
    description: Запрос на подтверждение регистрации.
    properties:
      code:
        description: Код, полученный с email
        example: "0228"
        type: string
      token:
        description: Токен, который вернул handler register/resend-confirmation
        example: 89as098ga0998=asdg=+afgk==
        type: string
    required:
    - code
    - token
    type: object
  LoginRequest:
    description: Данные, для входа.
    properties:
      email:
        description: Электронная почта пользователя
        example: Dimka228@gmail.com
        format: email
        type: string
      password:
        description: Пароль пользователя
        example: "12345678"
        format: password
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  RefreshRequest:
    description: Запрос, в котор передаёт refresh токен мобильное приложение
    properties:
      refreshToken:
        description: Refresh токен
        type: string
    type: object
  ResendRequest:
    description: Запрос на переотправку кода подтверждения.
    properties:
      email:
        description: Электронная почта пользователя
        example: Dimka228@gmail.com
        format: email
        type: string
    required:
    - email
    type: object
  TokenResponse:
    description: Ответ, содержащий access и refresh токены
    properties:
      accessToken:
        description: Access токен
        type: string
      refreshToken:
        description: Refresh токен
        type: string
    type: object
  User:
    description: Модель пользователя, хз что ещё сказать можно по этому поводу.
    properties:
      blocked:
        description: Заблокирован ли пользователь
        example: false
        type: boolean
      confirmed:
        description: Подтверждён ли пользователь
        example: true
        type: boolean
      createdAt:
        description: Timestamp создания аккаунта
        example: "2006-01-02T15:04:05Z"
        format: date-time
        type: string
      deleted:
        description: Удалён ли пользователь
        example: true
        type: boolean
      email:
        description: Электронная почта пользователя
        example: Dimka228@gmail.com
        type: string
      id:
        description: ID пользователя
        example: b4b03119-1290-44bc-b599-6a5e91d6611f
        type: string
      role:
        description: Роль пользователя
        example: user
        type: string
      updatedAt:
        description: Timestamp последнего обновления аккаунта
        example: "2006-01-02T15:04:05Z"
        format: date-time
        type: string
      username:
        description: Имя пользователя
        example: Dimka228
        type: string
    required:
    - blocked
    - confirmed
    - createdAt
    - deleted
    - email
    - id
    - role
    - updatedAt
    type: object
  hackathon-back_internal_model.SearchResult:
    properties:
      article:
        $ref: '#/definitions/Article'
      highlight:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Флоу авторизации: сначала пользователь регистрируется, в ответе получает модельку своего user и токен.
    Токен + код с почты он отправляет на ручку confirm, если что-то идёт не так (токен истёк, не пришёл код на почту), то запрос нужно отправить на ручку resend-confirmation.
    Далее уже можно авторизоваться, login/refresh/test-login выставляет в cookie access и refresh токены, фронтенду, ничего с ними делать не нужно, они сами по себе живут в браузере и отправляются при каждом запросе.
    Специально для мобильного приложения при login/refresh/test-login токены дублируются в теле ответа.
    При запросе к защищённым ручкам API мобильному приложению необходимо выставить заголовок Authorization: Bearer *access_token*.
    При refresh мобильное приложение передаёт refresh токен в теле запроса.
  title: Hackathon API
  version: 0.1.0
paths:
  /article:
    post:
      consumes:
      - application/json
      description: Создать статью.
      parameters:
      - description: Данные для создания статьи
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/ArticleCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/Article'
              type: object
        "400":
          description: Invalid body param
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to get article
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      security:
      - AccessToken: []
      - RefreshToken: []
      summary: Создать статью.
      tags:
      - Articles
  /article/{article_id}:
    delete:
      description: Удалить статью по ID.
      parameters:
      - description: Article UUID
        in: path
        name: article_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "400":
          description: Invalid path param
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "404":
          description: Article not found
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to delete article
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      security:
      - AccessToken: []
      - RefreshToken: []
      summary: Удалить статью.
      tags:
      - Articles
    get:
      description: Получить статью по ID.
      parameters:
      - description: Article UUID
        in: path
        name: article_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/Article'
              type: object
        "400":
          description: Invalid path param
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "404":
          description: Article not found
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to get article
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      security:
      - AccessToken: []
      - RefreshToken: []
      summary: Получить статью по ID.
      tags:
      - Articles
    patch:
      consumes:
      - application/json
      description: Частично обновить статью. Некоторые поля могут быть пустыми, обновляются
        только те, которые не пустые.
      parameters:
      - description: Article UUID
        in: path
        name: article_id
        required: true
        type: string
      - description: Поля для обновления статьи
        in: body
        name: updateArticle
        required: true
        schema:
          $ref: '#/definitions/ArticleCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "400":
          description: Invalid path param
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "404":
          description: Article not found
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to update article
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      security:
      - AccessToken: []
      - RefreshToken: []
      summary: Частично обновить статью.
      tags:
      - Articles
  /article/search:
    get:
      description: Полнотекстовый поиск по статьям.
      parameters:
      - description: Строка поиска
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/hackathon-back_internal_model.SearchResult'
                  type: array
              type: object
        "400":
          description: Invalid query param
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to get articles
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      security:
      - AccessToken: []
      - RefreshToken: []
      summary: Поиск статей по содержанию.
      tags:
      - Articles
  /auth/confirm:
    post:
      consumes:
      - application/json
      description: Принимает код с почты + временный токен, который вернул handler
        register/resend-confirmation.
      parameters:
      - description: Данные для подтверждения пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/ConfirmationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User confirmed successfully
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "400":
          description: Invalid JSON body
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "401":
          description: Invalid verification code/Token has expired
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "404":
          description: Token does not exist
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to confirmation user
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      summary: Подтверждение пользователя.
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Принимает почту и пароль, выставляет access и refresh токен в cookie, они автоматически отправляются при каждом запросе к api.
        Login только подтверждённых пользователей.
      parameters:
      - description: Данные для подтверждения входа
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/TokenResponse'
              type: object
        "400":
          description: Invalid JSON body
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "401":
          description: Invalid credential/User isn't confirmed
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "404":
          description: User does not exist
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to login user
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      summary: Login пользователя.
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Аннигиляция access и refresh токена.
        Для web-клиентов токен автоматически берётся из cookies, затем access и refresh токены сбрасываются.
        Для мобильного клиента .
      parameters:
      - description: Refresh токен (Нужно только при передаче токена из мобильного
          проложения!)
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "400":
          description: Invalid JSON body
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to logout
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      summary: Logout пользователя.
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Получает refresh токен из cookies (Для мобильного приложения нужно
        передать токен в теле запроса), проверяет его, если он не истёк, то выставляет
        новые access и refresh токены.
      parameters:
      - description: Refresh токен (Нужно только при передаче токена из мобильного
          проложения!)
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/TokenResponse'
              type: object
        "400":
          description: Invalid JSON body
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "401":
          description: Refresh token expired
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "404":
          description: User does not exist
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to refresh user
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      summary: Refresh jwt токенов.
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Принимает данные об имени, почте, пароле. Далее сохраняет пользователя в бд,
        отправляет 4-х значный код на почту и возвращает структуру пользователя, токен, который нужен для подтверждения регистрации.
      parameters:
      - description: Данные для регистрации пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/AuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/AuthResponse'
              type: object
        "400":
          description: Invalid JSON body
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to register user
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      summary: Регистрация пользователя.
      tags:
      - Auth
  /auth/resend-confirmation:
    post:
      consumes:
      - application/json
      description: |-
        Генерирует новую пару токен + 4-х значный код, код отправляет на почту,
        возвращает новый токен, старый аннулируется.
      parameters:
      - description: Данные для повторной отправки кода подтверждения
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/ResendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/AuthToken'
              type: object
        "400":
          description: Invalid JSON body
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to resend confirmation
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      summary: Повторная отправка токена кода подтверждения.
      tags:
      - Auth
  /auth/test-login:
    post:
      description: |-
        Создаёт пользователя с рандомными данными, выставляет access токен в cookie.
        Учти, читатель, пользователь здесь не сохраняется в бд, т.е. refresh токен не выставляется и в теле возвращается пустая строка.
        Из этого можно сделать вывод, что этот логин будет действителен примерно 20 минут.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/TokenResponse'
              type: object
        "500":
          description: Failed to login user
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      summary: Тестовый единоразовый вход.
      tags:
      - Auth
  /health/ping:
    get:
      description: Возвращает “pong”.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      summary: Проверка здоровья сервиса.
      tags:
      - Health
  /health/protected/ping:
    get:
      description: Возвращает “pong” + uuid пользователя из JWT, который её вызвал.
      produces:
      - application/json
      responses:
        "200":
          description: Success + id
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "401":
          description: Invalid or missing JWT token
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "403":
          description: Invalid user data format
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      security:
      - AccessToken: []
      - RefreshToken: []
      summary: Проверка здоровья сервиса, используя JWT.
      tags:
      - Health
  /user:
    get:
      description: Получить пользователя по id. id берётся из JWT токена.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/User'
              type: object
        "400":
          description: Invalid path param
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "401":
          description: Invalid or missing token
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "403":
          description: Invalid user data format
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to get user
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      security:
      - AccessToken: []
      - RefreshToken: []
      summary: Получить пользователя по id.
      tags:
      - User
  /user/{user_id}:
    delete:
      description: Удаляет пользователя по id, доступно для пользователей с ролью
        manager и выше.
      parameters:
      - description: User UUID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "400":
          description: Invalid path param
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to delete user
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
      security:
      - AccessToken: []
      - RefreshToken: []
      summary: Удаляет пользователя по id.
      tags:
      - User
    get:
      description: Получить пользователя по id.
      parameters:
      - description: User UUID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/_ResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/User'
              type: object
        "400":
          description: Invalid path param
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
        "500":
          description: Failed to get user
          schema:
            $ref: '#/definitions/_ResponseWithMessage'
